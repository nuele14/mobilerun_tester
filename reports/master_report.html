<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileRun Test Suite - Master Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-pass: #10b981;
            --accent-fail: #ef4444;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #334155;
        }
        .kpi-val { font-size: 28px; font-weight: 700; margin-top: 4px; }
        .kpi-val.pass { color: var(--accent-pass); }
        .kpi-val.fail { color: var(--accent-fail); }
        
        .badge { padding: 8px 16px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; }
        .badge.pass { background: rgba(16, 185, 129, 0.2); color: var(--accent-pass); border: 1px solid var(--accent-pass); }
        .badge.fail { background: rgba(239, 68, 68, 0.2); color: var(--accent-fail); border: 1px solid var(--accent-fail); }
        
        .step-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .step-badge.pass { background: var(--accent-pass); color: #000; }
        .step-badge.fail { background: var(--accent-fail); color: #fff; }

        .scenario-row {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .scenario-row.fail { border-left: 4px solid var(--accent-fail); }
        .scenario-row h3 { margin: 0 0 4px 0; font-size: 18px; color: #38bdf8; }
        .meta { color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <div>
                <h1>🏆 MobileRun Master Test Suite</h1>
                <div class="meta">Riepilogo Esecuzione Batch Scenari</div>
            </div>
            <div><span class="badge fail">SUITE FAILED</span></div>
        </div>

        <div class="kpi-container">
            <div class="kpi-card">
                <div class="meta">Totale Scenari</div>
                <div class="kpi-val">1</div>
            </div>
            <div class="kpi-card">
                <div class="meta">Passati / Falliti</div>
                <div class="kpi-val pass">0 <span style="font-size:16px; color:#94a3b8;">/</span> <span class="fail">1</span></div>
            </div>
            <div class="kpi-card">
                <div class="meta">Tempo Totale</div>
                <div class="kpi-val">182.79s</div>
            </div>
        </div>

        <h2>📂 Scenari Eseguiti (1)</h2>
        
            <div class="scenario-row fail">
                <div>
                    <h3>Login Flow Scenario - Production Suite</h3>
                    <div class="meta">Steps: 7 | Durata: 182.79s</div>
                </div>
                <div><span class="step-badge fail">FAILED</span></div>
            </div>
            
    </div>
</body>
</html>
