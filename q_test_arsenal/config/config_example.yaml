# ===============================================================================
# Q - TEST ARSENAL - CONFIG EXAMPLE TEMPLATE WITH MULTI-PROVIDER SUPPORT
# ===============================================================================

provider:
  type: "local"                                                 # local | openai | gemini | openrouter | groq | ollama
  model_name: "UI-TARS-7B-DPO-Q4_K_M.gguf"
  api_url: "http://127.0.0.1:8080/v1/chat/completions"

server:
  models_dir: "~/.modelli_llm"                                  # Local GGUF models directory path (Required for local llama-server)
  host: "127.0.0.1"
  port: 8080
  model_path: "~/.modelli_llm/UI-TARS-7B-DPO-Q4_K_M.gguf"
  mmproj_path: "~/.modelli_llm/mmproj-UI-TARS-7B-f16.gguf"
  binary: "llama-server"
  context_size: 4096
  gpu_layers: 99
  threads: 8
  flash_attn: true
  auto_start: true

device:
  serial: ""                                                    # Leave empty to trigger interactive ADB device selection
  show_touches: true

runner:
  default_max_retries: 3
  debug_screenshots_dir: "reports/screenshots"
  reports_dir: "reports"
  check_missing_env_vars: true

credentials:
  OPENAI_API_KEY: "sk-your-openai-api-key"
  GEMINI_API_KEY: "AIzaSy-your-gemini-api-key"
  OPENROUTER_API_KEY: "sk-or-your-openrouter-api-key"
  GROQ_API_KEY: "gsk_your_groq_api_key"
