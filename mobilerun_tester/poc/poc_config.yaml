# Configurazione per il Proof of Concept (PoC) Mobilerun Tester con llama.cpp

llama_cpp:
  # Percorso dell'eseguibile llama-server (o semplicemente 'llama-server' se nel PATH)
  server_binary: "llama-server"
  
  # Percorso assoluto al modello principale GGUF (es. Qwen2-VL o Qwen2.5-VL)
  model_path: "~/.modelli_llm/UI-TARS-7B-DPO-Q4_K_M.gguf"
  
  # Percorso assoluto al file di proiezione multimodale mmproj
  mmproj_path: "~/.modelli_llm/mmproj-UI-TARS-7B-f16.gguf"
  
  # Host e Porta su cui avviare il server HTTP
  host: "127.0.0.1"
  port: 8080
  
  # Dimensione del contesto (token)
  context_size: 4096
  
  # Numero di layer da scaricare sulla GPU (-ngl / --n-gpu-layers). 99 per usare tutta la GPU/Metal
  gpu_layers: 99
  
  # Avvia automaticamente llama-server da Python se non già in esecuzione
  auto_start_server: true
  
  # Timeout in secondi per l'avvio del server
  startup_timeout_seconds: 60

device:
  # Serial ADB del dispositivo (lasciare vuoto per selezionare automaticamente il primo connesso)
  serial: ""

scenario:
  # Percorso dello scenario YAML da eseguire di default
  default_path: "poc_scenario.yaml"
